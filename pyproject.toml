[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeltrace-ai-ml"
version = "0.1.0"
description = "Reproducible ML engineering and validation engine for ModelTrace AI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "xlrd>=2.0",
  "ucimlrepo>=0.0.7",
  "joblib>=1.3",
  "python-dotenv>=1.0",
  "streamlit>=1.35",
  "reportlab>=4.2",
]

[project.optional-dependencies]
validation = ["fairlearn>=0.10", "shap>=0.44"]
statsmodels = ["statsmodels>=0.14"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["engine*"]

