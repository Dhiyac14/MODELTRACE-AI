<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #111827; }
      .sub { font-size: 16px; fill: #4b5563; }
      .col { font-size: 19px; font-weight: 700; fill: #111827; }
      .colsub { font-size: 13px; fill: #4b5563; }
      .box { font-size: 15px; font-weight: 600; fill: #111827; }
      .small { font-size: 12.5px; fill: #374151; }
      .p1 { fill: #e0ecff; stroke: #2f6fdf; stroke-width: 1.5; }
      .p2 { fill: #efe7fb; stroke: #7c4dcc; stroke-width: 1.5; }
      .in { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; }
      .llm { fill: #fff4e5; stroke: #d9822b; stroke-width: 1.5; }
      .human { fill: #e8f6ee; stroke: #2e9d5b; stroke-width: 1.5; }
      .frame { fill: none; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="52" class="title">MODELTRACE AI · architecture</text>
  <text x="40" y="80" class="sub">Agentic model risk factory: discover, document, redevelop, validate and monitor credit models, with a human approval gate at every stage</text>

  <!-- column frames -->
  <rect x="30" y="110" width="250" height="660" rx="14" class="frame"/>
  <rect x="300" y="110" width="400" height="660" rx="14" class="frame"/>
  <rect x="720" y="110" width="420" height="660" rx="14" class="frame"/>
  <rect x="1160" y="110" width="410" height="660" rx="14" class="frame"/>
  <text x="48" y="140" class="col">Inputs</text>
  <text x="318" y="140" class="col">ML engine · Person 1</text>
  <text x="318" y="160" class="colsub">engine/ · python -m engine.pipeline</text>
  <text x="738" y="140" class="col">Agents and LLM · Person 2</text>
  <text x="738" y="160" class="colsub">agents/ · llm/</text>
  <text x="1178" y="140" class="col">Governance and dashboard · Person 2</text>
  <text x="1178" y="160" class="colsub">workflow/ · inventory/ · app.py</text>

  <!-- inputs -->
  <rect x="50" y="185" width="210" height="108" rx="10" class="in"/>
  <text x="64" y="212" class="box">UCI dataset 350</text>
  <text x="64" y="234" class="small">30,000 credit-card clients</text>
  <text x="64" y="254" class="small">public demo data, not a</text>
  <text x="64" y="274" class="small">UK bank portfolio</text>
  <rect x="50" y="305" width="210" height="88" rx="10" class="in"/>
  <text x="64" y="332" class="box">Legacy R model</text>
  <text x="64" y="354" class="small">models/legacy_model.R</text>
  <text x="64" y="374" class="small">glm, binomial, logit</text>
  <rect x="50" y="405" width="210" height="88" rx="10" class="in"/>
  <text x="64" y="432" class="box">Outdated model document</text>
  <text x="64" y="454" class="small">models/</text>
  <text x="64" y="474" class="small">outdated_model_document.md</text>
  <text x="64" y="530" class="small">The Discovery Agent reads</text>
  <text x="64" y="550" class="small">the R model, engine/data.py</text>
  <text x="64" y="570" class="small">and this document.</text>

  <!-- engine -->
  <rect x="320" y="185" width="360" height="62" rx="10" class="p1"/>
  <text x="336" y="212" class="box">Data preparation</text>
  <text x="336" y="233" class="small">80/20 stratified split · SEX, AGE kept for fairness only</text>
  <rect x="320" y="263" width="360" height="62" rx="10" class="p1"/>
  <text x="336" y="290" class="box">R glm vs Statsmodels parity</text>
  <text x="336" y="311" class="small">same split · tolerance 1e-5 · overall_pass</text>
  <rect x="320" y="341" width="360" height="62" rx="10" class="p1"/>
  <text x="336" y="368" class="box">Validation</text>
  <text x="336" y="389" class="small">metrics · fairness by SEX and age · PSI · SHAP</text>
  <rect x="320" y="419" width="360" height="62" rx="10" class="p1"/>
  <text x="336" y="446" class="box">Monitoring batches</text>
  <text x="336" y="467" class="small">baseline, moderate, strong drift · PSI per feature</text>
  <rect x="320" y="497" width="360" height="62" rx="10" class="p1"/>
  <text x="336" y="524" class="box">Risk findings</text>
  <text x="336" y="545" class="small">evidence-backed register</text>
  <rect x="320" y="585" width="360" height="160" rx="10" class="in"/>
  <text x="336" y="612" class="box">Reports (JSON)</text>
  <text x="336" y="636" class="small">reports/migration/migration_results.json</text>
  <text x="336" y="656" class="small">reports/validation/validation_results.json</text>
  <text x="336" y="676" class="small">reports/monitoring/monitoring_results.json</text>
  <text x="336" y="696" class="small">reports/risk_findings/risk_findings_results.json</text>
  <text x="336" y="722" class="small">Migration and Validation Agents summarise these</text>

  <!-- agents -->
  <rect x="740" y="185" width="380" height="108" rx="10" class="p2"/>
  <text x="756" y="212" class="box">Discovery Agent</text>
  <text x="756" y="234" class="small">reads the R model, engine/data.py, old document</text>
  <text x="756" y="254" class="small">facts from code with checked line references</text>
  <text x="756" y="274" class="small">document vs code: contradiction, omission, unverifiable</text>
  <rect x="740" y="305" width="380" height="88" rx="10" class="p2"/>
  <text x="756" y="332" class="box">Documentation Agent</text>
  <text x="756" y="354" class="small">model card: figures copied from reports,</text>
  <text x="756" y="374" class="small">prose drafted by the LLM</text>
  <rect x="740" y="405" width="380" height="88" rx="10" class="p2"/>
  <text x="756" y="432" class="box">Monitoring Agent</text>
  <text x="756" y="454" class="small">alerts from fixed PSI rules (0.10 / 0.25),</text>
  <text x="756" y="474" class="small">explained by the LLM</text>
  <rect x="740" y="515" width="380" height="230" rx="10" class="llm"/>
  <text x="756" y="542" class="box">LLM: Claude Opus 5.5 (medium effort)</text>
  <text x="756" y="565" class="small">proposes; code verifies:</text>
  <text x="756" y="588" class="small">• every quoted line checked against the file</text>
  <text x="756" y="610" class="small">• features, threshold, split compared in code</text>
  <text x="756" y="632" class="small">• numbers in prose must exist in the evidence</text>
  <text x="756" y="654" class="small">• rules set risk tier and alert severity</text>
  <text x="756" y="676" class="small">• refusals and truncation raise errors</text>
  <text x="756" y="698" class="small">• every call logged (governance/llm_call_log.jsonl)</text>
  <text x="756" y="726" class="small">no customer records are sent to the LLM</text>

  <!-- governance -->
  <rect x="1180" y="185" width="370" height="62" rx="10" class="human"/>
  <text x="1196" y="212" class="box">People (pick a user, no login)</text>
  <text x="1196" y="233" class="small">developer · validator · risk manager · monitoring analyst</text>
  <rect x="1180" y="263" width="370" height="46" rx="10" class="p2"/>
  <text x="1196" y="292" class="box">Streamlit dashboard · 8 sections</text>
  <rect x="1180" y="325" width="370" height="228" rx="10" class="p2"/>
  <text x="1196" y="352" class="box">Five-stage approval workflow</text>
  <g font-size="14" font-weight="600" fill="#111827">
    <rect x="1196" y="366" width="338" height="28" rx="6" fill="#ffffff" stroke="#7c4dcc"/>
    <text x="1208" y="385">1 Discover · inventory and risk tier</text>
    <rect x="1196" y="400" width="338" height="28" rx="6" fill="#ffffff" stroke="#7c4dcc"/>
    <text x="1208" y="419">2 Document · model card</text>
    <rect x="1196" y="434" width="338" height="28" rx="6" fill="#ffffff" stroke="#7c4dcc"/>
    <text x="1208" y="453">3 Redevelop · needs parity pass</text>
    <rect x="1196" y="468" width="338" height="28" rx="6" fill="#ffffff" stroke="#7c4dcc"/>
    <text x="1208" y="487">4 Validate · independent of the builder</text>
    <rect x="1196" y="502" width="338" height="28" rx="6" fill="#ffffff" stroke="#7c4dcc"/>
    <text x="1208" y="521">5 Monitor · alert review and escalation</text>
  </g>
  <text x="1196" y="546" class="small">approve · reject · request changes · reopen</text>
  <rect x="1180" y="569" width="370" height="70" rx="10" class="p2"/>
  <text x="1196" y="596" class="box">Separation of duties</text>
  <text x="1196" y="617" class="small">role matrix · four-eyes · no agent approvals</text>
  <rect x="1180" y="655" width="370" height="90" rx="10" class="p2"/>
  <text x="1196" y="682" class="box">Audit log and evidence hashes</text>
  <text x="1196" y="703" class="small">hash-chained events · approvals bound to file hashes</text>
  <text x="1196" y="723" class="small">SS1/23 mapping: governance/ss1_23_mapping.json</text>

  <!-- flows -->
  <path d="M260 220 C290 220 295 216 318 216" class="flow"/>
  <path d="M260 349 C290 349 290 294 318 294" class="flow"/>
  <path d="M500 559 L500 583" class="flow"/>
  <path d="M680 640 C708 640 710 349 738 349" class="flow"/>
  <path d="M680 670 C712 670 714 449 738 449" class="flow"/>
  <path d="M930 493 L930 513" class="soft"/>
  <path d="M1120 239 C1150 239 1150 380 1194 380" class="flow"/>
  <path d="M1120 349 C1150 349 1155 414 1194 414" class="flow"/>
  <path d="M1120 449 C1150 449 1155 516 1194 516" class="flow"/>
  <path d="M500 745 L500 784 L1168 784 L1168 482 L1194 482" class="flow"/>
  <text x="720" y="799" class="small">reports are the evidence for gates 3 to 5</text>
  <path d="M1365 247 L1365 261" class="flow"/>
  <path d="M1365 309 L1365 323" class="flow"/>

  <!-- legend -->
  <g transform="translate(40,818)">
    <rect width="22" height="16" rx="3" class="p1"/><text x="30" y="13" class="small">Person 1 (ML engineering)</text>
    <rect x="240" width="22" height="16" rx="3" class="p2"/><text x="270" y="13" class="small">Person 2 (agents, governance, application)</text>
    <rect x="560" width="22" height="16" rx="3" class="llm"/><text x="590" y="13" class="small">LLM with deterministic checks</text>
    <rect x="820" width="22" height="16" rx="3" class="human"/><text x="850" y="13" class="small">human decisions</text>
    <path d="M1010 8 L1060 8" class="flow"/><text x="1070" y="13" class="small">data and evidence</text>
    <path d="M1230 8 L1280 8" class="soft"/><text x="1290" y="13" class="small">uses</text>
  </g>
  <text x="40" y="872" class="small">Prototype on public data. Nothing is retrained, replaced or deployed automatically; every stage needs a human decision recorded in the audit log.</text>
</svg>
