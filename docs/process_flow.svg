<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #111827; }
      .sub { font-size: 16px; fill: #4b5563; }
      .head { font-size: 19px; font-weight: 700; fill: #111827; }
      .box { font-size: 15px; font-weight: 600; fill: #111827; }
      .small { font-size: 12.5px; fill: #374151; }
      .actor { fill: #e8f6ee; stroke: #2e9d5b; stroke-width: 1.5; }
      .process { fill: #efe7fb; stroke: #7c4dcc; stroke-width: 1.5; }
      .evidence { fill: #e0ecff; stroke: #2f6fdf; stroke-width: 1.5; }
      .decision { fill: #fff4e5; stroke: #d9822b; stroke-width: 1.5; }
      .note { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; }
      .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="40" y="52" class="title">MODELTRACE AI · process flow and use cases</text>
  <text x="40" y="80" class="sub">How users, agents, deterministic checks and evidence move a model through the risk lifecycle</text>

  <!-- actors -->
  <rect x="40" y="125" width="250" height="170" rx="14" class="actor"/>
  <text x="62" y="158" class="head">Human roles</text>
  <text x="62" y="188" class="small">Developer</text>
  <text x="62" y="212" class="small">Independent validator</text>
  <text x="62" y="236" class="small">Monitoring analyst</text>
  <text x="62" y="260" class="small">Risk manager / approver</text>
  <rect x="1310" y="125" width="250" height="170" rx="14" class="actor"/>
  <text x="1332" y="158" class="head">External inputs</text>
  <text x="1332" y="188" class="small">UCI public demonstration data</text>
  <text x="1332" y="212" class="small">R model and documentation</text>
  <text x="1332" y="236" class="small">Python model source files</text>
  <text x="1332" y="260" class="small">Existing JSON evidence</text>

  <!-- lifecycle -->
  <text x="420" y="130" class="head">Lifecycle process</text>
  <rect x="360" y="155" width="340" height="72" rx="10" class="process"/>
  <text x="382" y="184" class="box">1. Discover</text>
  <text x="382" y="207" class="small">Extract code facts and compare documents</text>
  <rect x="360" y="255" width="340" height="72" rx="10" class="process"/>
  <text x="382" y="284" class="box">2. Document</text>
  <text x="382" y="307" class="small">Build an evidence-linked model card</text>
  <rect x="360" y="355" width="340" height="72" rx="10" class="process"/>
  <text x="382" y="384" class="box">3. Redevelop</text>
  <text x="382" y="407" class="small">Generate or review a Python candidate</text>
  <rect x="360" y="455" width="340" height="72" rx="10" class="process"/>
  <text x="382" y="484" class="box">4. Validate</text>
  <text x="382" y="507" class="small">Check parity, metrics, fairness and SHAP</text>
  <rect x="360" y="555" width="340" height="72" rx="10" class="process"/>
  <text x="382" y="584" class="box">5. Monitor</text>
  <text x="382" y="607" class="small">Review drift alerts and escalation</text>

  <!-- gate decisions -->
  <text x="810" y="130" class="head">Approval gate at every stage</text>
  <rect x="770" y="155" width="300" height="72" rx="10" class="decision"/>
  <text x="792" y="184" class="box">Review evidence</text>
  <text x="792" y="207" class="small">A human reviews the current stage</text>
  <rect x="770" y="275" width="300" height="72" rx="10" class="decision"/>
  <text x="792" y="304" class="box">Decision</text>
  <text x="792" y="327" class="small">Approve, reject or request changes</text>
  <rect x="770" y="395" width="300" height="72" rx="10" class="decision"/>
  <text x="792" y="424" class="box">Audit record</text>
  <text x="792" y="447" class="small">Hash evidence and record actor/comment</text>
  <rect x="770" y="515" width="300" height="112" rx="10" class="note"/>
  <text x="792" y="544" class="box">Rework loop</text>
  <text x="792" y="567" class="small">Rejected or changed evidence returns</text>
  <text x="792" y="589" class="small">to the same lifecycle stage; later</text>
  <text x="792" y="611" class="small">approvals can be invalidated if evidence changes</text>

  <!-- outputs and use cases -->
  <text x="1170" y="365" class="head">Use cases and outputs</text>
  <rect x="1130" y="390" width="430" height="62" rx="10" class="evidence"/>
  <text x="1152" y="418" class="box">Discover model inventory and discrepancies</text>
  <text x="1152" y="439" class="small">Discovery JSON with checked source references</text>
  <rect x="1130" y="470" width="430" height="62" rx="10" class="evidence"/>
  <text x="1152" y="498" class="box">Produce model cards and governance evidence</text>
  <text x="1152" y="519" class="small">Documentation JSON, Markdown and audit trail</text>
  <rect x="1130" y="550" width="430" height="62" rx="10" class="evidence"/>
  <text x="1152" y="578" class="box">Compare implementations and validate risk</text>
  <text x="1152" y="599" class="small">Parity, validation, fairness and explainability reports</text>
  <rect x="1130" y="630" width="430" height="62" rx="10" class="evidence"/>
  <text x="1152" y="658" class="box">Monitor drift and manage alerts</text>
  <text x="1152" y="679" class="small">Monitoring batches, findings and escalations</text>
  <rect x="1130" y="710" width="430" height="62" rx="10" class="evidence"/>
  <text x="1152" y="738" class="box">Generate evidence-backed PDF reports</text>
  <text x="1152" y="759" class="small">Individual model and three-model portfolio reports</text>

  <!-- AI controls -->
  <rect x="360" y="700" width="340" height="112" rx="10" class="note"/>
  <text x="382" y="729" class="box">AI assistance with deterministic controls</text>
  <text x="382" y="752" class="small">LLM proposes prose, code or explanations;</text>
  <text x="382" y="774" class="small">static checks, source quotes, sandboxing and</text>
  <text x="382" y="796" class="small">parity tests constrain and verify the output</text>

  <!-- flows -->
  <path d="M290 210 C320 210 330 190 358 190" class="dashed"/>
  <path d="M1310 210 C1250 210 1220 190 1072 190" class="dashed"/>
  <path d="M530 227 L530 253" class="flow"/>
  <path d="M530 327 L530 353" class="flow"/>
  <path d="M530 427 L530 453" class="flow"/>
  <path d="M530 527 L530 553" class="flow"/>
  <path d="M700 190 C730 190 740 190 768 190" class="flow"/>
  <path d="M920 227 L920 273" class="flow"/>
  <path d="M920 347 L920 393" class="flow"/>
  <path d="M920 467 L920 513" class="flow"/>
  <path d="M770 571 C720 571 710 590 702 590" class="dashed"/>
  <path d="M1070 430 C1090 430 1100 421 1128 421" class="flow"/>
  <path d="M1070 510 C1090 510 1100 501 1128 501" class="flow"/>
  <path d="M1070 590 C1090 590 1100 581 1128 581" class="flow"/>
  <path d="M1070 670 C1090 670 1100 661 1128 661" class="flow"/>
  <path d="M1070 750 C1090 750 1100 741 1128 741" class="flow"/>
  <path d="M290 260 C340 260 360 760 358 760" class="dashed"/>

  <text x="40" y="900" class="small">No model is retrained, replaced or deployed automatically. Human decisions, evidence hashes and audit events remain part of the record.</text>
  <text x="40" y="925" class="small">Public demonstration data only; customer records are not sent to the LLM.</text>
</svg>
